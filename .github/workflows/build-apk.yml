name: Zbuduj podpisane APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4

      - name: Zainstaluj Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Ustaw Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Sprawdź klucz aktualizacji
        env:
          KEYSTORE_BASE64: ${{ secrets.SMC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Brak sekretu SMC_KEYSTORE_BASE64. Dodaj go w Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smc-release.jks"

      - name: Zbuduj podpisane APK
        env:
          SMC_KEYSTORE_PATH: ${{ runner.temp }}/smc-release.jks
        run: gradle :app:assembleRelease --stacktrace

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: SMC-Trading-Journal-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
